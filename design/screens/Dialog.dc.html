<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rabisco wi-fi dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Literata:wght@400;600&amp;family=Shantell+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#555555}
</style>
</helmet>
<div style="position: relative; width: 600px; height: 800px; box-sizing: border-box; background: #ffffff; color: #111111; font-family: 'Shantell Sans', 'Comic Sans MS', cursive; overflow: hidden; filter: {{filter}};">
  <div style="position: absolute; inset: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 0;">
    <h2 style="margin: 0 0 14px; text-align: center; font-family: Gaegu, cursive; font-weight: 700; font-size: 40px; line-height: 40px;">news</h2>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; justify-content: center; min-height: 76px; border-bottom: 1.5px dashed #888888;">
        <span style="font-size: 18px; line-height: 26px; font-weight: 600;">{{r.a}}</span>
        <span style="font-size: 15px; line-height: 20px; color: #555555;">{{r.b}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(-45deg, #888888 0 1px, transparent 1px 10px);"></div>

  <div style="position: absolute; left: 50px; right: 50px; top: 250px; box-sizing: border-box; background: #ffffff; border: 3.5px solid #111111; border-radius: 15px 225px 15px 255px / 225px 15px 255px 15px; box-shadow: 3px 3px 0 #111111; padding: 24px 22px 20px;">
    <span style="position: absolute; top: -22px; right: 18px; line-height: 0; padding: 3px; background: #ffffff; border-radius: 999px; transform: rotate(1.5deg);">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24.10 3.83 C24.50 6.73 23.06 17.80 26.46 21.18 C29.87 24.56 44.44 23.09 44.54 24.11 C44.64 25.13 30.48 23.96 27.08 27.29 C23.68 30.63 25.22 44.26 24.15 44.14 C23.09 44.03 24.03 30.02 20.70 26.58 C17.37 23.14 4.03 24.45 4.17 23.50 C4.31 22.56 18.11 24.00 21.51 20.92 C24.92 17.84 24.08 7.67 24.59 5.02"/><path d="M39.00 6.87 C39.00 7.39 39.04 8.93 39.03 9.99 C39.03 11.06 38.97 12.71 38.96 13.25"/><path d="M36.02 9.95 C36.51 9.97 37.93 10.05 38.95 10.07 C39.98 10.09 41.63 10.05 42.16 10.05"/></svg>
    </span>
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.39 17.57 C9.60 17.45 10.18 17.00 10.62 16.82 C11.05 16.64 11.53 16.51 12.00 16.49 C12.47 16.47 12.98 16.55 13.43 16.71 C13.88 16.88 14.48 17.36 14.69 17.49"/><path d="M6.61 14.98 C6.93 14.73 7.80 13.83 8.50 13.48 C9.20 13.13 10.04 13.01 10.82 12.89 C11.61 12.76 12.44 12.60 13.21 12.72 C13.98 12.84 14.72 13.23 15.44 13.59 C16.16 13.94 17.19 14.63 17.54 14.84"/><path d="M3.88 12.44 C4.15 12.16 4.84 11.17 5.47 10.77 C6.10 10.37 6.95 10.30 7.67 10.05 C8.39 9.80 9.05 9.49 9.77 9.29 C10.49 9.09 11.25 8.91 12.00 8.86 C12.75 8.81 13.55 8.83 14.29 8.97 C15.04 9.12 15.81 9.38 16.46 9.75 C17.11 10.12 17.56 10.81 18.22 11.21 C18.88 11.61 20.05 12.00 20.42 12.16"/><path d="M12.10 19.81 l0.15 0.05"/></svg>
      <h1 style="margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 28px; line-height: 30px;">turn on wi-fi?</h1>
    </div>
    <p style="margin: 12px 0 22px; font-size: 18px; line-height: 26px;">rabisco needs the internet to fetch your feeds. it’ll switch off again when it’s done.</p>
    <div style="display: flex; justify-content: flex-end; gap: 14px;">
      <button style="min-height: 56px; padding: 0 20px; font: 600 20px/1 'Shantell Sans', cursive; background: #ffffff; color: #111111; border: 2.5px solid #111111; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;">not now</button>
      <button style="min-height: 56px; padding: 0 22px; font: 600 20px/1 'Shantell Sans', cursive; background: #111111; color: #ffffff; border: 2.5px solid #111111; border-radius: 15px 225px 15px 255px / 225px 15px 255px 15px; box-shadow: 3px 3px 0 #111111;">turn on</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":600,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['hundred rabbits', 'tools, sailing, permacomputing'], ['quanta magazine', 'math, physics, biology'],
      ['aeon', 'philosophy and long essays'], ['noema', 'big ideas about the future'],
      ['low-tech magazine', 'radical sustainability'], ['the marginalian', 'art, literature, wonder'],
      ['lobsters', 'programming'], ['literary hub', 'books and writers']
    ];
    return {
      filter: this.props.night ? 'invert(1)' : 'none',
      rows: rows.map(function (r) { return { a: r[0], b: r[1] }; })
    };
  }
}
</script>
</body>
</html>
