<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rabisco settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Literata:wght@400;600&amp;family=Shantell+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#555555}
</style>
</helmet>
<div style="width: 600px; height: 800px; box-sizing: border-box; background: #ffffff; color: #111111; font-family: 'Shantell Sans', 'Comic Sans MS', cursive; display: flex; flex-direction: column; padding: 14px 20px 10px; filter: {{filter}};">
  <div style="display: flex; align-items: center; gap: 8px;">
    <button aria-label="go back" style="width: 56px; height: 56px; display: grid; place-items: center; background: none; border: none; padding: 0;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.05 12.39 C18.78 12.26 14.98 11.68 12.39 11.62 C9.80 11.55 5.84 11.94 4.53 12.00"/><path d="M10.14 6.05 L4.22 11.90 L10.71 18.28"/></svg>
    </button>
    <h1 style="margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 40px; line-height: 40px;">settings</h1>
  </div>

  <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 18px 4px 4px;">
        <span style="font-weight: 600; font-size: 13px; line-height: 16px; letter-spacing: 0.04em; color: #555555;">{{s.title}}</span>
        <svg width="34" height="12" viewBox="0 0 48 48" preserveAspectRatio="none" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4.00 16.85 C4.83 19.43 7.33 32.33 9.00 32.34 C10.67 32.35 12.33 17.01 14.00 16.92 C15.67 16.83 17.33 31.65 19.00 31.80 C20.67 31.96 22.33 17.79 24.00 17.87 C25.67 17.96 27.33 32.57 29.00 32.30 C30.67 32.03 32.33 16.33 34.00 16.26 C35.67 16.19 37.33 31.73 39.00 31.89 C40.67 32.05 43.17 19.670 44.00 17.22"/></svg>
      </div>
      <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
        <div style="min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 6px; border-bottom: 1.5px dashed #888888;">
          <div style="display: flex; flex-direction: column;">
            <span style="font-size: 18px; line-height: 26px;">{{r.label}}</span>
            <sc-if value="{{r.hint}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 15px; line-height: 20px; color: #555555;">{{r.hint}}</span>
            </sc-if>
          </div>
          <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{true}}">
            <span style="position: relative; width: 58px; height: 32px; flex: none; box-sizing: border-box; border: 2.5px solid #111111; border-radius: 140px 110px 150px 120px / 60px 70px 55px 75px; background: {{r.track}};">
              <span style="position: absolute; top: 3px; left: {{r.knobLeft}}; width: 21px; height: 21px; box-sizing: border-box; border-radius: 999px; background: {{r.knob}}; border: 2.5px solid {{r.knobEdge}};"></span>
            </span>
          </sc-if>
          <sc-if value="{{r.isCheck}}" hint-placeholder-val="{{false}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="overflow: visible; flex: none;" aria-hidden="true">
              <path d="M3.08 3.30 L8.97 3.32 L14.68 3.12 L20.49 2.92 L20.77 9.00 L20.79 14.91 L20.97 20.81 L15.15 20.80 L9.06 20.92 L3.31 20.98 L3.22 15.06 L3.13 9.35 L2.96 3.31 L3.60 3.39"/>
              <sc-if value="{{r.on}}" hint-placeholder-val="{{true}}">
                <path d="M5.79 12.41 C6.37 13.23 8.24 17.28 9.30 17.35 C10.35 17.41 10.51 14.80 12.12 12.79 C13.72 10.79 16.88 7.20 18.91 5.32 C20.94 3.44 23.39 2.13 24.28 1.49" stroke-width="3.2"/>
              </sc-if>
            </svg>
          </sc-if>
          <sc-if value="{{r.isValue}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 15px; line-height: 20px; color: #555555; white-space: nowrap;">{{r.value}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":600,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    function row(label, kind, on, value, hint) {
      return {
        label: label, hint: hint || '', value: value || '', on: !!on,
        isToggle: kind === 't', isCheck: kind === 'c', isValue: kind === 'v',
        track: on ? '#111111' : '#dddddd',
        knob: on ? '#ffffff' : '#ffffff',
        knobEdge: on ? '#ffffff' : '#111111',
        knobLeft: on ? '29px' : '4px'
      };
    }
    return {
      filter: this.props.night ? 'invert(1)' : 'none',
      sections: [
        { title: 'device', rows: [
          row('night mode', 't', false),
          row('frontlight', 'v', false, '14 · warm 3 ›'),
          row('wi-fi', 't', true, '', 'home network')
        ] },
        { title: 'reading', rows: [
          row('show page numbers', 'c', true),
          row('invert images in night mode', 'c', false),
          row('full refresh', 'v', false, 'every 6 pages ›', 'clears e-ink ghosting')
        ] },
        { title: 'look', rows: [
          row('theme', 'v', false, 'rabisco ›'),
          row('interface font', 'v', false, 'shantell sans ›')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
