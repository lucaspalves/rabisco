<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rabisco sleep screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Literata:wght@400;600&amp;family=Shantell+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#555555}
</style>
</helmet>
<div style="width: 600px; height: 800px; box-sizing: border-box; background-color: #ffffff; background-image: repeating-linear-gradient(-45deg, #dddddd 0 1.5px, transparent 1.5px 14px); color: #111111; font-family: 'Shantell Sans', 'Comic Sans MS', cursive; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding: 40px; filter: {{filter}};">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: #ffffff; padding: 18px 34px 14px; border: 3.5px solid #111111; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; box-shadow: 3px 3px 0 #111111; transform: rotate(-2deg);">
    <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.70 18.57 C16.36 18.77 15.37 19.52 14.64 19.73 C13.90 19.95 13.05 19.90 12.29 19.87 C11.52 19.84 10.77 19.72 10.03 19.55 C9.29 19.37 8.49 19.19 7.85 18.80 C7.20 18.42 6.67 17.80 6.16 17.23 C5.65 16.66 5.15 16.06 4.78 15.38 C4.42 14.71 4.07 13.94 3.98 13.18 C3.88 12.43 4.12 11.63 4.23 10.86 C4.33 10.08 4.31 9.24 4.61 8.54 C4.91 7.84 5.50 7.22 6.04 6.66 C6.57 6.10 7.18 5.61 7.83 5.17 C8.48 4.73 9.17 4.23 9.92 4.03 C10.66 3.83 11.52 3.88 12.29 3.97 C13.06 4.06 13.80 4.33 14.53 4.59 C15.25 4.84 16.29 5.35 16.65 5.50"/><path d="M16.83 5.41 C16.08 5.91 13.23 7.31 12.33 8.42 C11.43 9.53 11.33 10.87 11.43 12.06 C11.53 13.26 12.06 14.46 12.93 15.57 C13.80 16.69 16.04 18.24 16.66 18.77"/><path d="M19.75 9.49 l0.15 0.05"/><path d="M17.95 4.27 l0.15 0.05"/></svg>
    <h1 style="margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 64px; line-height: 60px;">shh… sleeping</h1>
  </div>

  <div style="display: flex; align-items: center; gap: 18px; background: #ffffff; padding: 16px 22px; border: 2.5px solid #111111; border-radius: 15px 225px 15px 255px / 225px 15px 255px 15px; transform: rotate(1.5deg); max-width: 400px;">
    <div style="width: 70px; height: 96px; flex: none; display: grid; place-items: center; background-color: #ffffff; background-image: repeating-linear-gradient(-45deg, #888888 0 1.5px, transparent 1.5px 8px); border: 2.5px solid #111111; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; box-shadow: 2px 2px 0 #111111;">
      <span style="font-family: Gaegu, cursive; font-weight: 700; font-size: 44px; line-height: 1; background: #ffffff; padding: 0 6px 3px; border-radius: 6px;">m</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-weight: 600; font-size: 13px; line-height: 16px; letter-spacing: 0.04em; color: #555555;">you were reading</span>
      <span style="font-size: 20px; line-height: 26px; font-weight: 600;">moby-dick</span>
      <span style="font-size: 15px; line-height: 20px; color: #555555;">herman melville · page 3 of 724</span>
    </div>
  </div>

  <span style="display: inline-block; background: #ffffff; padding: 4px 12px; border-radius: 6px; font-size: 15px; line-height: 20px; color: #555555;">press the power button to wake me up</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false},"$preview":{"width":600,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { filter: this.props.night ? 'invert(1)' : 'none' };
  }
}
</script>
</body>
</html>
